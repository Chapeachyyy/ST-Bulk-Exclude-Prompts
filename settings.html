<div id="bulk_exclude_prompts_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Bulk Exclude from Prompts</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="bulk_exclude_prompts_confirm">
                <input type="checkbox" id="bulk_exclude_prompts_confirm" />
                <span>Ask for confirmation before excluding a range (message-menu button)</span>
            </label>
            <div class="bulk-exclude-prompts-hint">
                Wand menu: "Exclude messages up to…" enters a selection mode. Click a message to select everything from #1 up to it, then press Exclude. Each message's Message Actions menu also has a ban button for a one-click version.
            </div>
            <div class="bulk-exclude-prompts-version">Bulk Exclude from Prompts v1.1.0</div>
        </div>
    </div>
</div>
